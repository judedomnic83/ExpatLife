$('authForm').onsubmit=async e=>{e.preventDefault();if(authBusy||ready)return;const username=$('authUser').value.trim().toLowerCase(),password=$('authPass').value;authBusy=true;$('authSubmit').disabled=true;$('authError').textContent='';try{if(vault){if(username!==vault.username)throw Error('Invalid username or password.');const key=await derive(password,vault.salt);let data;try{data=await unseal(vault,key);}catch(_){throw Error('Invalid username or password, or damaged vault.');}activate(data,key);}else{if(!/^[a-z0-9._-]{3,40}$/.test(username))throw Error('Use 3–40 letters, numbers, dots, underscores or hyphens.');if(password.length<12||password!==$('authConfirm').value)throw Error('Use at least 12 characters and matching passwords.');const salt=crypto.getRandomValues(new Uint8Array(16)),key=await derive(password,salt),data=legacy||blank(),v=await seal(data,key,{username,salt});await writeDB(v);vault=v;try{localStorage.removeItem(KEY);}catch(_){alert('The old browser storage could not be cleared. Keep this device private.');}activate(data,key);}}catch(err){$('authError').textContent=err.message||'Unable to unlock or save your account.';}finally{authBusy=false;$('authSubmit').disabled=false;$('authPass').value=$('authConfirm').value='';}};
async function init(){try{if(!window.isSecureContext||!globalThis.crypto?.subtle)throw Error('Open the HTTPS GitHub Pages address to use secure storage.');db=await openDB();const stored=await readDB();if(isVault(stored)){vault=stored;}else if(stored?.format==='ExpatLifeVault'){throw Error('The encrypted vault is damaged or unsupported. Do not clear site data.');}else if(stored!==undefined){legacy=validate(stored);}else{const raw=localStorage.getItem(KEY);legacy=raw?validate(JSON.parse(raw)):blank();}authView();}catch(e){storageOK=false;$('authTitle').textContent='Storage unavailable';$('authError').textContent=e.message||'Could not open storage. Your records have not been replaced.';}}
let toastTimer;function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',4000);}
async function commit(next,msg){if(!ready||busy||!sessionKey){toast('Storage is unavailable or busy. Try again.');return false;}busy=true;try{const encrypted=await seal(next,sessionKey,vault);await writeDB(encrypted);vault=encrypted;state=next;storageOK=true;render();toast(msg);return true;}catch(e){storageOK=false;render();toast('Could not save. Your previous records are unchanged.');return false;}finally{busy=false;}}
function go(p){page=p;render();window.scrollTo(0,0);}function due(){return [...state.docs.map(r=>({id:r.id,title:r.title,date:r.date,k:'docs'})),...state.bills.filter(r=>!r.done).map(r=>({...r,k:'bills'})),...state.tasks.filter(r=>!r.done).map(r=>({...r,k:'tasks'}))].sort((a,b)=>a.date.localeCompare(b.date));}function dueLabel(d){let n=days(d);return n<0?`${-n}d overdue`:n===0?'Due today':n===1?'Tomorrow':`${n} days`; }function dueColor(d){return days(d)<=0?'red':days(d)<=30?'gold':'green';}function totals(){let a=state.money.filter(r=>r.date.slice(0,7)===month);let income=0,expense=0,remit=0;for(let r of a){let n=Math.round(r.amount*100);if(r.type==='income')income+=n;else if(r.type==='remittance')remit+=n;else expense+=n;}return {income:income/100,expense:expense/100,remit:remit/100,out:(expense+remit)/100,balance:(income-expense-remit)/100};}function empty(t){return `<div class="empty">${esc(t)}</div>`;}function item(k,r){let icon=k==='docs'?'docs':k==='bills'?'building':k==='tasks'?'calendar':r.type==='income'?'income':r.type==='remittance'?'send':'expense';let status=k==='money'?`<span class="${r.type==='income'?'green':'red'}">${r.type==='income'?'+':'−'} AED ${fmt(r.amount)}</span>`:r.done?'<span class="green">Completed</span>':`<span class="${dueColor(r.date)}">${dueLabel(r.date)}</span>`;return `<button class="item" data-edit="${k}" data-id="${esc(r.id)}"><span class="itemicon">${ico(icon)}</span><span class="itemtext"><strong>${esc(r.title)}</strong><small>${datefmt(r.date)}${k==='bills'?' · AED '+fmt(r.amount):''}${k==='money'?' · '+esc(r.type):''}${k==='docs'?(r.attachments?.length?' · '+r.attachments.length+' attachment(s)':''):''}</small></span><span class="itemright">${status}</span></button>`;}function items(k,rs,msg){return rs.length?`<div class="list">${rs.map(r=>item(k,r)).join('')}</div>`:empty(msg);}function listDue(rs){return rs.length?`<div class="list">${rs.map(r=>item(r.k,r)).join('')}</div>`:empty('No upcoming deadlines. Add your first document or reminder.');}function tile(icon,text,action){return `<button class="tile" ${action}>${ico(icon)}<span>${text}</span></button>`;}function section(title,body,action=''){return `<section class="section"><div class="sectionhead"><h2>${title}</h2>${action}</div>${body}</section>`;}function addBtn(k,txt='Add'){return `<button class="primary" data-add="${k}">${txt}</button>`;}function pageHead(label,title,desc,btn=''){return `<div class="eyebrow">${label}</div><div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${btn}</div>`;}function sortDate(a){return [...a].sort((x,y)=>x.date.localeCompare(y.date));}function monthField(){return `<label class="sub" for="month">Reporting month</label><input id="month" type="month" value="${esc(month)}">`;}
function home(){let t=totals(),d=due(),urgent=d.filter(r=>days(r.date)<=30);return `<div class="eyebrow">Personal dashboard · UAE</div><h1>Welcome back.</h1><p>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · Make today count.</p><div class="balance"><div class="sub">MONTHLY CASH FLOW · ${esc(month)}</div><div class="money"><span class="currency">AED</span> ${fmt(t.balance)}</div><div class="two"><div class="stat"><span class="sub">Income</span><strong class="green">${fmt(t.income)}</strong></div><div class="stat"><span class="sub">Outgoings</span><strong>${fmt(t.out)}</strong></div></div></div>${section('Quick access',`<div class="quick">${tile('docs','Add document','data-add="docs"')}${tile('wallet','Add transaction','data-add="money"')}${tile('calendar','Add reminder','data-add="tasks"')}${tile('send','Remittance','data-remit="1"')}${tile('building','Rent & bills','data-go="bills"')}${tile('bell','All deadlines','data-go="planner"')}</div>`)}${section('Upcoming deadlines',`<p class="sub" style="margin-bottom:9px">${urgent.length} due within 30 days or overdue</p>${listDue(d.slice(0,5))}`,'<button class="link" data-go="planner">View all →</button>')}`;}
function finance(){let t=totals(),rs=state.money.filter(r=>r.date.slice(0,7)===month).sort((a,b)=>b.date.localeCompare(a.date));return pageHead('Money manager','Finance','Track your money in AED.',addBtn('money','+ Add'))+section('Overview',`<div class="panel">${monthField()}<div class="two"><div class="summary"><span class="sub">Income</span><strong class="green">${fmt(t.income)}</strong></div><div class="summary"><span class="sub">Expenses</span><strong>${fmt(t.expense)}</strong></div><div class="summary"><span class="sub">Remittance</span><strong>${fmt(t.remit)}</strong></div><div class="summary"><span class="sub">Net cash flow</span><strong class="${t.balance<0?'red':'gold'}">${fmt(t.balance)}</strong></div></div><div class="notice">Cash flow is income minus expenses and remittances for this month, not your bank balance.</div></div>`)+section('Transactions',items('money',rs,'No transactions for this month.'));}
function documents(){return pageHead('Document tracker','Documents','Keep renewal dates under control.',addBtn('docs','+ Add'))+section('Your documents',items('docs',sortDate(state.docs),'Add a passport, Emirates ID, visa or other expiry date.'))+'<p class="footnote">Attachments are encrypted in local storage. Files you separately download or open outside the app are not protected by ExpatLife.</p>';}
function planner(){let d=due(),done=state.tasks.filter(r=>r.done).sort((a,b)=>b.date.localeCompare(a.date));return pageHead('Stay on track','Planner','All expiry dates, bills and reminders.',addBtn('tasks','+ Add'))+section('Overdue & next 30 days',listDue(d.filter(r=>days(r.date)<=30)))+section('Later',listDue(d.filter(r=>days(r.date)>30)))+section('Completed reminders',items('tasks',done,'Nothing completed yet.'))+'<p class="footnote">Reminders are shown inside the app; this version does not send push notifications.</p>';}
function bills(){let open=sortDate(state.bills.filter(r=>!r.done)),done=sortDate(state.bills.filter(r=>r.done));return pageHead('Accommodation','Rent & bills','Track rent, utilities and payments.',addBtn('bills','+ Add'))+section('Pending payments',`<div class="summary" style="margin-bottom:10px"><span class="sub">Total outstanding · AED</span><strong class="gold">${fmt(open.reduce((a,r)=>a+Math.round(r.amount*100),0)/100)}</strong></div>${items('bills',open,'No outstanding bills.')}`)+section('Paid bills',items('bills',done,'No paid bills yet.'))+'<p class="footnote">Marking a bill paid does not automatically create a finance transaction. Record the expense separately if needed.</p>';}
function more(){return pageHead('Personal edition','More','Manage your app and data.')+section('Modules',`<div class="list"><button class="item" data-go="bills"><span class="itemicon">${ico('building')}</span><span class="itemtext"><strong>Rent & bills</strong><small>Accommodation and utilities</small></span>${ico('arrow')}</button><button class="item" data-remit="1"><span class="itemicon">${ico('send')}</span><span class="itemtext"><strong>Add remittance</strong><small>Track money sent home in AED</small></span>${ico('arrow')}</button></div>`)+section('Your data',`<div class="panel"><p>Records and attachments are encrypted in IndexedDB on this device. They do not sync across devices. Keep your password safe; it cannot be recovered.</p><button class="secondary full" id="export">Export encrypted backup (JSON)</button><button class="secondary full" id="import">Restore backup</button><button class="secondary full danger" id="reset">Delete all local records</button><p class="notice">New backups are encrypted using your account password at export time. Keep the password and backup safe. Old V1.2 backups remain readable and should be secured separately.</p></div>`)+`<p class="footnote">ExpatLife 1.3 · Independent personal tool, not affiliated with UAE government services or banks.</p>`;}
function render(){if(!ready)return;$('brandIcon').innerHTML=ico('logo');$('bell').innerHTML=ico('bell')+(due().some(r=>days(r.date)<=30)?'<span class="dot"></span>':'');$('nav').innerHTML=navs.map(([p,n,i])=>`<button data-go="${p}" class="${page===p||(p==='more'&&page==='bills')?'active':''}" ${page===p?'aria-current="page"':''}>${ico(i)}<span>${n}</span></button>`).join('');$('view').innerHTML=({home,finance,documents,planner,bills,more}[page]||home)()+(!storageOK?'<p class="notice red">Local storage could not be read or saved. Export accessible records before closing. Editing may be unavailable.</p>':'');}
const kinds={docs:'document',money:'transaction',bills:'bill',tasks:'reminder'};function field(label,name,type,value,extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}function openEditor(k,id=null,remit=false){if(!ready||busy){toast('Storage is not ready. Try again.');return;}editorToken++;readingFiles=false;let r=id?state[k].find(x=>x.id===id):null;if(id&&!r)return;editing={k,id};draftFiles=k==='docs'?[...(r?.attachments||[])]:[];$('modalTitle').textContent=(r?'Edit ':'Add ')+kinds[k];let titleLabel=k==='docs'?'Document name':k==='money'?'Description':k==='bills'?'Bill name':'Reminder name';let placeholder={docs:'e.g. Emirates ID',money:'e.g. Salary or groceries',bills:'e.g. Monthly rent',tasks:'e.g. Renew insurance'}[k];let html=field(titleLabel,'title','text',r?.title||'',`required maxlength="100" placeholder="${placeholder}"`);if(k==='money'){let type=r?.type||(remit?'remittance':'expense');html+=`<label>Transaction type<select name="type">${['income','expense','remittance'].map(x=>`<option value="${x}" ${type===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></label>`;}if(k==='money'||k==='bills')html+=field('Amount (AED)','amount','number',r?.amount??'',`required min="${k==='money'?'0.01':'0'}" max="1000000000" step="0.01" inputmode="decimal" placeholder="0.00"`);html+=field(k==='docs'?'Expiry date':k==='money'?'Transaction date':'Due date','date','date',r?.date||today(),'required');if(k==='bills'||k==='tasks')html+=`<label>Status<select name="done"><option value="no" ${!r?.done?'selected':''}>Pending</option><option value="yes" ${r?.done?'selected':''}>${k==='bills'?'Paid':'Completed'}</option></select></label>`;if(k==='docs')html+=`<section class="attachbox"><h3>Document attachments (optional)</h3><div class="actions"><button type="button" class="secondary" id="cameraBtn">📷 Take photo</button><button type="button" class="secondary" id="uploadBtn">↑ Upload file</button></div><input id="cameraFile" class="hide" type="file" accept="image/*" capture="environment"><input id="uploadFile" class="hide" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,application/pdf,.heic,.heif,.pdf" multiple><p class="notice">Up to 4 photos or PDFs per document, 5 MB each; 40 MB total. Encrypted on save. Original photos outside the app are not protected.</p><div id="attachmentList"></div></section>`;html+=`<div class="actions"><button class="primary" type="submit">Save ${kinds[k]}</button>${r?'<button type="button" class="secondary danger" id="deleteRecord">Delete</button>':''}</div>`;$('form').innerHTML=html;if(k==='docs'){renderAttachments();$('cameraBtn').onclick=()=>$('cameraFile').click();$('uploadBtn').onclick=()=>$('uploadFile').click();$('cameraFile').onchange=$('uploadFile').onchange=pickFiles;}$('modal').showModal();}
function fileSize(n){return n>=1024*1024?(n/(1024*1024)).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';}
function renderAttachments(){const el=$('attachmentList');if(!el)return;el.innerHTML=draftFiles.length?draftFiles.map((f,i)=>`<div class="attachment">${['image/jpeg','image/png','image/webp'].includes(f.type)?`<img alt="" src="data:${f.type};base64,${f.data}">`:`<span class="itemicon">${ico('docs')}</span>`}<span class="itemtext"><strong>${esc(f.name)}</strong><small>${fileSize(f.size)}</small></span><button type="button" data-preview="${i}">View</button><button type="button" class="danger" data-remove-file="${i}" aria-label="Remove ${esc(f.name)}">Remove</button></div>`).join(''):'<p class="sub">No attachments added.</p>';}
function toBase64(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(file);});}
function detectType(file){const ext=(file.name.split('.').pop()||'').toLowerCase();return MIME.includes(file.type)?file.type:({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif',pdf:'application/pdf'})[ext];}
async function pickFiles(e){const input=e.target,files=[...input.files],token=editorToken;input.value='';if(readingFiles||busy)return;readingFiles=true;const form=$('form');const controls=[...form.querySelectorAll('button')];controls.forEach(b=>b.disabled=true);try{let other=state.docs.filter(r=>r.id!==editing?.id).reduce((n,r)=>n+(r.attachments||[]).reduce((a,f)=>a+f.size,0),0);for(const file of files){if(token!==editorToken||!$('modal').open)return;if(draftFiles.length>=MAX_ATTACH){toast('Maximum 4 attachments per document.');break;}if(!file.size||file.size>MAX_FILE){toast('File must be 5 MB or smaller.');continue;}if(other+draftFiles.reduce((n,f)=>n+f.size,0)+file.size>MAX_TOTAL){toast('Total attachment limit is 40 MB.');break;}const type=detectType(file);if(!type){toast('Choose a JPG, PNG, WebP, HEIC or PDF file.');continue;}try{const f=checkAttachment({id:uid(),name:file.name||'Camera photo',type,size:file.size,data:await toBase64(file)});if(token!==editorToken||!$('modal').open)return;draftFiles.push(f);}catch(_){toast('This file could not be read or is unsupported.');}}if(token===editorToken)renderAttachments();}finally{if(token===editorToken){readingFiles=false;controls.forEach(b=>b.disabled=false);}}}
function showPreview(f){if(!f)return;const bytes=Uint8Array.from(atob(f.data),c=>c.charCodeAt(0));previewURL=URL.createObjectURL(new Blob([bytes],{type:f.type}));const url=previewURL;const body=$('previewBody');const preview=['image/jpeg','image/png','image/webp'].includes(f.type)?`<img class="previewimg" alt="${esc(f.name)}" src="${url}">`:'<p class="notice">Open this attachment in your device’s file viewer. HEIC and PDF previews depend on your phone.</p>';body.innerHTML=`<p class="sub" style="margin-bottom:12px;overflow-wrap:anywhere">${esc(f.name)} · ${fileSize(f.size)}</p>${preview}<a class="filelink" href="${url}" target="_blank" rel="noopener">Open file</a><a class="filelink" href="${url}" download="${esc(f.name)}">Download / save a copy</a>`;$('preview').showModal();}
$('closePreview').onclick=()=>$('preview').close();$('preview').addEventListener('close',()=>{if(previewURL)URL.revokeObjectURL(previewURL);previewURL=null;$('previewBody').innerHTML='';});
$('modal').addEventListener('close',()=>{editorToken++;draftFiles=[];readingFiles=false;editing=null;$('form').innerHTML='';});
$('close').innerHTML=ico('x');$('close').onclick=()=>{if(!busy)$('modal').close();};$('modal').addEventListener('cancel',e=>{if(busy)e.preventDefault();});$('bell').onclick=()=>go('planner');
$('form').onsubmit=async e=>{e.preventDefault();if(!editing||busy||readingFiles)return;let {k,id}=editing,f=new FormData(e.currentTarget),r={id:id||uid(),title:String(f.get('title')).trim(),date:String(f.get('date'))};if(!r.title||!validDate(r.date)){toast('Enter a name and valid date.');return;}if(k==='money'||k==='bills'){r.amount=Math.round(Number(f.get('amount'))*100)/100;if(!Number.isFinite(r.amount)||r.amount<(k==='money'?.01:0)||r.amount>1e9){toast('Enter a valid amount.');return;}}if(k==='money')r.type=String(f.get('type'));if(k==='bills'||k==='tasks')r.done=f.get('done')==='yes';if(k==='docs')r.attachments=[...draftFiles];const next={...state,[k]:id?state[k].map(x=>x.id===id?r:x):[...state[k],r]};if(totalBytes(next)>MAX_TOTAL){toast('Total attachment limit is 40 MB.');return;}if(k==='money')month=r.date.slice(0,7);const controls=[...$('form').querySelectorAll('button')];controls.forEach(b=>b.disabled=true);if(await commit(next,'Saved successfully'))$('modal').close();else controls.forEach(b=>b.disabled=false);};
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b||busy||!ready)return;if(b.dataset.go)go(b.dataset.go);else if(b.dataset.add)openEditor(b.dataset.add);else if(b.dataset.edit)openEditor(b.dataset.edit,b.dataset.id);else if(b.dataset.remit)openEditor('money',null,true);else if(b.dataset.preview!==undefined)showPreview(draftFiles[Number(b.dataset.preview)]);else if(b.dataset.removeFile!==undefined){draftFiles.splice(Number(b.dataset.removeFile),1);renderAttachments();}else if(b.id==='deleteRecord'&&editing&&confirm('Delete this record and its attachments?')){let{k,id}=editing;const next={...state,[k]:state[k].filter(x=>x.id!==id)};if(await commit(next,'Record deleted'))$('modal').close();}else if(b.id==='export'){let blob=new Blob([JSON.stringify(backupObject(vault))],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ExpatLife-backup-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}else if(b.id==='import')$('restoreFile').click();else if(b.id==='reset'&&confirm('Permanently delete all ExpatLife records and attachments from this browser? Export a backup first if needed.')){await commit(blank(),'All local records cleared');}});
document.addEventListener('change',e=>{if(e.target.id==='month'&&/^\d{4}-\d\d$/.test(e.target.value)){month=e.target.value;render();}});
$('restoreFile').onchange=async e=>{let file=e.target.files[0];if(!file||!ready)return;const epoch=sessionEpoch;try{if(file.size>105*1024*1024)throw Error('File too large');const raw=JSON.parse(await file.text());let incoming;if(raw.format==='ExpatLifeVault'){const v=parseBackup(raw);let password=prompt('Enter the password used when this backup was exported.');if(password===null)return;const key=await derive(password,v.salt);password=null;incoming=await unseal(v,key);}else incoming=validate(raw);if(!ready||epoch!==sessionEpoch)return;if(confirm('Replace all current records and attachments with this backup?'))await commit(incoming,'Backup restored');}catch(err){if(ready&&epoch===sessionEpoch)toast('Invalid backup or incorrect backup password. Existing records were not changed.');}finally{e.target.value='';}};window.addEventListener('focus',()=>{if(ready&&Date.now()-lastAction>=LOCK_MS)lock();else if(ready&&!$('modal').open)render();});init();
