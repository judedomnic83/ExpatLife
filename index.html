<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1420"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ExpatLife"><meta name="color-scheme" content="dark"><title>ExpatLife</title><style>

ion:relative}.balance:after{content:'';border:1px solid #ffffff13;width:190px;height:190px;position:absolute;right:-94px;top:-115px;border-radius:50%;pointer-events:none}.money{font-size:36px;font-weight:700;letter-spacing:-1.6px;font-variant-numeric:tabular-nums;margin:8px 0 20px;overflow-wrap:anywhere}.currency{font-size:15px;font-weight:500;color:var(--gold);letter-spacing:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{border-top:1px solid #ffffff1f;padding-top:13px}.stat strong{display:block;font-size:17px;margin-top:5px;overflow-wrap:anywhere}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:19px;text-align:left;padding:14px 11px;min-height:95px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-size:12px;font-weight:600}.tile svg{color:var(--gold)}.tile:hover,.item:hover{background:var(--panel2)}.list{display:flex;flex-direction:column;gap:8px}.item{width:100%;display:flex;align-items:center;text-align:left;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px;min-height:65px}.itemicon{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:var(--panel2);color:var(--gold);flex-shrink:0}.itemtext{flex:1;min-width:0}.itemtext strong{display:block;font-size:14px;overflow-wrap:anywhere}.itemtext small{display:block;color:var(--muted);font-size:12px;margin-top:4px;overflow-wrap:anywhere}.itemright{text-align:right;max-width:45%;font-size:12px;font-weight:650;overflow-wrap:anywhere}.empty{background:#14223388;border:1px dashed #34495e;border-radius:17px;padding:22px 15px;text-align:center;color:var(--muted);line-height:1.6;font-size:13px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0e1a28f5;border-top:1px solid var(--line);backdrop-filter:blur(18px);padding:9px 9px calc(9px + env(safe-area-inset-bottom));z-index:3}.navinner{display:flex;max-width:580px;margin:auto}.nav button{flex:1;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;padding:8px 0;min-width:0}.nav button.active{color:var(--gold)}.nav button.active svg{stroke-width:2.3}.primary{background:var(--gold);color:#182331;border-radius:14px;padding:13px 17px;font-weight:750;min-height:44px}.secondary{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;min-height:44px}.danger{color:var(--red)}.full{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1}.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.chip{background:var(--panel2);border:1px solid var(--line);padding:5px 9px;border-radius:20px;color:var(--muted);font-size:11px;white-space:nowrap}.summary{padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:18px}.summary strong{display:block;font-size:23px;letter-spacing:-.6px;margin-top:6px;overflow-wrap:anywhere}.notice{font-size:12px;color:var(--muted);padding:12px 0;line-height:1.55}.panel{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:12px}dialog{color:var(--text);background:#142233;border:1px solid #43546a;border-radius:25px 25px 0 0;width:min(100%,580px);max-width:100%;max-height:90dvh;margin:auto auto 0;padding:23px 20px calc(25px + env(safe-area-inset-bottom));overflow:auto;box-shadow:0 -10px 50px #0008}dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}dialog h2{font-size:23px}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}form label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--muted);margin-bottom:15px}input,select{width:100%;background:#0d1927;color:var(--text);border:1px solid #3b4e63;border-radius:12px;padding:12px;min-height:47px;font-size:16px;min-width:0}input[type=date],input[type=month]{appearance:none;display:block;max-width:100%;min-height:47px}input::placeholder{color:#8092a5}#toast{position:fixed;z-index:9;bottom:calc(89px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#26394b;border:1px solid #53677c;color:var(--text);padding:12px 18px;border-radius:14px;max-width:90vw;width:max-content;box-shadow:0 8px 20px #0005;font-size:13px;display:none}.hide{display:none!important}.footnote{color:var(--muted);font-size:11px;line-height:1.6;margin-top:20px;text-align:center}svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.smallsvg svg{width:17px;height:17px}@media(min-width:600px){dialog{border-radius:25px;margin:auto}.nav{max-width:580px;margin:auto;border:1px solid var(--line);border-radius:22px 22px 0 0}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,transform .15s}button:active{transform:scale(.98)}}
</style></head><body><main><header><div class="brand"><span class="mark" id="brandIcon"></span><div><strong>ExpatLife<span class="gold">.</span></strong><div class="sub">Your UAE life, simplified</div></div></div><button class="iconbtn" id="bell" aria-label="Upcoming reminders"></button></header><div id="view"></div></main><nav class="nav" aria-label="Main navigation"><div class="navinner" id="nav"></div></nav><dialog id="modal"><div class="dialoghead"><h2 id="modalTitle"></h2><button class="iconbtn" id="close" type="button" aria-label="Close"></button></div><form id="form"></form></dialog><div id="toast" role="status"></div><input type="file" accept="application/json,.json" id="restoreFile" hidden><script>
'use strict';
const paths={logo:'<path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="m7 12 3 3 7-7"/>',home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 8V6a2 2 0 0 1 2-2l12-2v3m4 6h-5a2 2 0 0 0 0 4h5"/>',docs:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M5.5 16a3.5 3.5 0 0 1 7 0M15 10h3m-3 4h3"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18m-13 5h3m3 0h2"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2 2 0 0 0 4 0"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',building:'<path d="M3 21h18M5 21V5l10-3v19m0-12h4v12M9 7h2M9 11h2M9 15h2"/>',plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="m6 6 12 12M18 6 6 18"/>',arrow:'<path d="m9 18 6-6-6-6"/>',income:'<path d="M12 3v18m-6-6 6 6 6-6"/>',expense:'<path d="M12 21V3m-6 6 6-6 6 6"/>',check:'<path d="m5 12 4 4L19 6"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.calendar}</svg>`;const $=id=>document.getElementById(id);const KEY='expatlife-v1';const blank=()=>({docs:[],money:[],bills:[],tasks:[]});let state=blank(),storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw));}catch(e){storageOK=false;}let page='home',month=today().slice(0,7),editing=null;const navs=[['home','Home','home'],['finance','Finance','wallet'],['documents','Documents','docs'],['planner','Planner','calendar'],['more','More','more']];
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}function validDate(v){if(typeof v!=='string'||!/^\d{4}-\d\d-\d\d$/.test(v))return false;const d=new Date(v+'T00:00:00Z');return Number.isFinite(+d)&&d.toISOString().slice(0,10)===v;}function days(d){return Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/86400000);}function datefmt(d){return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}function fmt(n){return new Intl.NumberFormat('en-AE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);}function uid(){return globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);}function validate(s){const out=blank();if(!s||typeof s!=='object')throw Error('Invalid backup');for(const k of Object.keys(out)){if(!Array.isArray(s[k])||s[k].length>20000)throw Error('Invalid backup');const ids=new Set();out[k]=s[k].map(r=>{if(!r||typeof r.id!=='string'||ids.has(r.id)||typeof r.title!=='string'||!r.title.trim()||!validDate(r.date))throw Error('Invalid record');ids.add(r.id);const a={id:r.id.slice(0,100),title:r.title.slice(0,100),date:r.date};if(k==='money'){if(!['income','expense','remittance'].includes(r.type)||typeof r.amount!=='number'||!Number.isFinite(r.amount)||r.amount<=0||r.amount>1e9)throw Error('Invalid transaction');a.type=r.type;a.amount=Math.round(r.amount*100)/100;}if(k==='bills'){if(typeof r.amount!=='number'||!Number.isFinite(r.amount)||r.amount<0||r.amount>1e9)throw Error('Invalid bill');a.amount=Math.round(r.amount*100)/100;}if(k==='bills'||k==='tasks')a.done=r.done===true;return a;});}return out;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;return true;}catch(e){storageOK=false;return false;}}let toastTimer;function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',3500);}function changed(t){const ok=save();render();toast(ok?t:'Storage unavailable. Export a backup before closing.');}function go(p){page=p;render();window.scrollTo(0,0);}function due(){return [...state.docs.map(r=>({...r,k:'docs'})),...state.bills.filter(r=>!r.done).map(r=>({...r,k:'bills'})),...state.tasks.filter(r=>!r.done).map(r=>({...r,k:'tasks'}))].sort((a,b)=>a.date.localeCompare(b.date));}function dueLabel(d){let n=days(d);return n<0?`${-n}d overdue`:n===0?'Due today':n===1?'Tomorrow':`${n} days`; }function dueColor(d){return days(d)<=0?'red':days(d)<=30?'gold':'green';}function totals(){let a=state.money.filter(r=>r.date.slice(0,7)===month);let income=0,expense=0,remit=0;for(let r of a){let n=Math.round(r.amount*100);if(r.type==='income')income+=n;else if(r.type==='remittance')remit+=n;else expense+=n;}return {income:income/100,expense:expense/100,remit:remit/100,out:(expense+remit)/100,balance:(income-expense-remit)/100};}function empty(t){return `<div class="empty">${esc(t)}</div>`;}function item(k,r){let icon=k==='docs'?'docs':k==='bills'?'building':k==='tasks'?'calendar':r.type==='income'?'income':r.type==='remittance'?'send':'expense';let status=k==='money'?`<span class="${r.type==='income'?'green':'red'}">${r.type==='income'?'+':'−'} AED ${fmt(r.amount)}</span>`:r.done?'<span class="green">Completed</span>':`<span class="${dueColor(r.date)}">${dueLabel(r.date)}</span>`;return `<button class="item" data-edit="${k}" data-id="${esc(r.id)}"><span class="itemicon">${ico(icon)}</span><span class="itemtext"><strong>${esc(r.title)}</strong><small>${datefmt(r.date)}${k==='bills'?' · AED '+fmt(r.amount):''}${k==='money'?' · '+esc(r.type):''}</small></span><span class="itemright">${status}</span></button>`;}function items(k,rs,msg){return rs.length?`<div class="list">${rs.map(r=>item(k,r)).join('')}</div>`:empty(msg);}function listDue(rs){return rs.length?`<div class="list">${rs.map(r=>item(r.k,r)).join('')}</div>`:empty('No upcoming deadlines. Add your first document or reminder.');}function tile(icon,text,action){return `<button class="tile" ${action}>${ico(icon)}<span>${text}</span></button>`;}function section(title,body,action=''){return `<section class="section"><div class="sectionhead"><h2>${title}</h2>${action}</div>${body}</section>`;}function addBtn(k,txt='Add'){return `<button class="primary" data-add="${k}">${txt}</button>`;}function pageHead(label,title,desc,btn=''){return `<div class="eyebrow">${label}</div><div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${btn}</div>`;}function sortDate(a){return [...a].sort((x,y)=>x.date.localeCompare(y.date));}function monthField(){return `<label class="sub" for="month">Reporting month</label><input id="month" type="month" value="${esc(month)}">`;}
function home(){let t=totals(),d=due(),urgent=d.filter(r=>days(r.date)<=30);return `<div class="eyebrow">Personal dashboard · UAE</div><h1>Welcome back.</h1><p>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · Make today count.</p><div class="balance"><div class="sub">MONTHLY CASH FLOW · ${esc(month)}</div><div class="money"><span class="currency">AED</span> ${fmt(t.balance)}</div><div class="two"><div class="stat"><span class="sub">Income</span><strong class="green">${fmt(t.income)}</strong></div><div class="stat"><span class="sub">Outgoings</span><strong>${fmt(t.out)}</strong></div></div></div>${section('Quick access',`<div class="quick">${tile('docs','Add document','data-add="docs"')}${tile('wallet','Add transaction','data-add="money"')}${tile('calendar','Add reminder','data-add="tasks"')}${tile('send','Remittance','data-remit="1"')}${tile('building','Rent & bills','data-go="bills"')}${tile('bell','All deadlines','data-go="planner"')}</div>`)}${section('Upcoming deadlines',`<p class="sub" style="margin-bottom:9px">${urgent.length} due within 30 days or overdue</p>${listDue(d.slice(0,5))}`,'<button class="link" data-go="planner">View all →</button>')}`;}
function finance(){let t=totals(),rs=state.money.filter(r=>r.date.slice(0,7)===month).sort((a,b)=>b.date.localeCompare(a.date));return pageHead('Money manager','Finance','Track your money in AED.',addBtn('money','+ Add'))+section('Overview',`<div class="panel">${monthField()}<div class="two"><div class="summary"><span class="sub">Income</span><strong class="green">${fmt(t.income)}</strong></div><div class="summary"><span class="sub">Expenses</span><strong>${fmt(t.expense)}</strong></div><div class="summary"><span class="sub">Remittance</span><strong>${fmt(t.remit)}</strong></div><div class="summary"><span class="sub">Net cash flow</span><strong class="${t.balance<0?'red':'gold'}">${fmt(t.balance)}</strong></div></div><div class="notice">Cash flow is income minus expenses and remittances for this month, not your bank balance.</div></div>`)+section('Transactions',items('money',rs,'No transactions for this month.'));}
function documents(){return pageHead('Document tracker','Documents','Keep renewal dates under control.',addBtn('docs','+ Add'))+section('Your documents',items('docs',sortDate(state.docs),'Add a passport, Emirates ID, visa or other expiry date.'))+'<p class="footnote">Store document names and dates only. Do not enter ID numbers, passport numbers or scans.</p>';}
function planner(){let d=due(),done=state.tasks.filter(r=>r.done).sort((a,b)=>b.date.localeCompare(a.date));return pageHead('Stay on track','Planner','All expiry dates, bills and reminders.',addBtn('tasks','+ Add'))+section('Overdue & next 30 days',listDue(d.filter(r=>days(r.date)<=30)))+section('Later',listDue(d.filter(r=>days(r.date)>30)))+section('Completed reminders',items('tasks',done,'Nothing completed yet.'))+'<p class="footnote">Reminders are shown inside the app; this version does not send push notifications.</p>';}
function bills(){let open=sortDate(state.bills.filter(r=>!r.done)),done=sortDate(state.bills.filter(r=>r.done));return pageHead('Accommodation','Rent & bills','Track rent, utilities and payments.',addBtn('bills','+ Add'))+section('Pending payments',`<div class="summary" style="margin-bottom:10px"><span class="sub">Total outstanding · AED</span><strong class="gold">${fmt(open.reduce((a,r)=>a+Math.round(r.amount*100),0)/100)}</strong></div>${items('bills',open,'No outstanding bills.')}`)+section('Paid bills',items('bills',done,'No paid bills yet.'))+'<p class="footnote">Marking a bill paid does not automatically create a finance transaction. Record the expense separately if needed.</p>';}
function more(){return pageHead('Personal edition','More','Manage your app and data.')+section('Modules',`<div class="list"><button class="item" data-go="bills"><span class="itemicon">${ico('building')}</span><span class="itemtext"><strong>Rent & bills</strong><small>Accommodation and utilities</small></span>${ico('arrow')}</button><button class="item" data-remit="1"><span class="itemicon">${ico('send')}</span><span class="itemtext"><strong>Add remittance</strong><small>Track money sent home in AED</small></span>${ico('arrow')}</button></div>`)+section('Your data',`<div class="panel"><p>Records are stored in this browser on this device. They are not encrypted by ExpatLife and do not sync across devices.</p><button class="secondary full" id="export">Export backup (JSON)</button><button class="secondary full" id="import">Restore backup</button><button class="secondary full danger" id="reset">Delete all local records</button><p class="notice">Backups contain your records in readable form. Keep them private. Export before clearing Safari data or changing devices.</p></div>`)+`<p class="footnote">ExpatLife 1.0 · Independent personal tool, not affiliated with UAE government services or banks.</p>`;}
function render(){$('brandIcon').innerHTML=ico('logo');$('bell').innerHTML=ico('bell')+(due().some(r=>days(r.date)<=30)?'<span class="dot"></span>':'');$('nav').innerHTML=navs.map(([p,n,i])=>`<button data-go="${p}" class="${page===p||(p==='more'&&page==='bills')?'active':''}" ${page===p?'aria-current="page"':''}>${ico(i)}<span>${n}</span></button>`).join('');$('view').innerHTML=({home,finance,documents,planner,bills,more}[page]||home)()+(!storageOK?'<p class="notice red">Local storage could not be read or saved. Export your data before closing.</p>':'');}
const kinds={docs:'document',money:'transaction',bills:'bill',tasks:'reminder'};function field(label,name,type,value,extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}function openEditor(k,id=null,remit=false){let r=id?state[k].find(x=>x.id===id):null;if(id&&!r)return;editing={k,id};$('modalTitle').textContent=(r?'Edit ':'Add ')+kinds[k];let titleLabel=k==='docs'?'Document name':k==='money'?'Description':k==='bills'?'Bill name':'Reminder name';let placeholder={docs:'e.g. Emirates ID',money:'e.g. Salary or groceries',bills:'e.g. Monthly rent',tasks:'e.g. Renew insurance'}[k];let html=field(titleLabel,'title','text',r?.title||'',`required maxlength="100" placeholder="${placeholder}"`);if(k==='money'){let type=r?.type||(remit?'remittance':'expense');html+=`<label>Transaction type<select name="type">${['income','expense','remittance'].map(x=>`<option value="${x}" ${type===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></label>`;}if(k==='money'||k==='bills')html+=field('Amount (AED)','amount','number',r?.amount??'',`required min="${k==='money'?'0.01':'0'}" max="1000000000" step="0.01" inputmode="decimal" placeholder="0.00"`);html+=field(k==='docs'?'Expiry date':k==='money'?'Transaction date':'Due date','date','date',r?.date||today(),'required');if(k==='bills'||k==='tasks')html+=`<label>Status<select name="done"><option value="no" ${!r?.done?'selected':''}>Pending</option><option value="yes" ${r?.done?'selected':''}>${k==='bills'?'Paid':'Completed'}</option></select></label>`;html+=`<div class="actions"><button class="primary" type="submit">Save ${kinds[k]}</button>${r?'<button type="button" class="secondary danger" id="deleteRecord">Delete</button>':''}</div>`;$('form').innerHTML=html;$('modal').showModal();}
$('close').innerHTML=ico('x');$('close').onclick=()=>$('modal').close();$('bell').onclick=()=>go('planner');$('form').onsubmit=e=>{e.preventDefault();if(!editing)return;let {k,id}=editing,f=new FormData(e.currentTarget),r={id:id||uid(),title:String(f.get('title')).trim(),date:String(f.get('date'))};if(!r.title||!validDate(r.date)){toast('Enter a name and valid date.');return;}if(k==='money'||k==='bills'){r.amount=Math.round(Number(f.get('amount'))*100)/100;if(!Number.isFinite(r.amount)||r.amount<(k==='money'?.01:0)||r.amount>1e9){toast('Enter a valid amount.');return;}}if(k==='money')r.type=String(f.get('type'));if(k==='bills'||k==='tasks')r.done=f.get('done')==='yes';if(id)state[k]=state[k].map(x=>x.id===id?r:x);else state[k].push(r);if(k==='money')month=r.date.slice(0,7);$('modal').close();changed('Saved successfully');};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);else if(b.dataset.add)openEditor(b.dataset.add);else if(b.dataset.edit)openEditor(b.dataset.edit,b.dataset.id);else if(b.dataset.remit)openEditor('money',null,true);else if(b.id==='deleteRecord'&&editing&&confirm('Delete this record?')){let{k,id}=editing;state[k]=state[k].filter(x=>x.id!==id);$('modal').close();changed('Record deleted');}else if(b.id==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ExpatLife-backup-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}else if(b.id==='import')$('restoreFile').click();else if(b.id==='reset'&&confirm('Permanently delete all ExpatLife records from this browser? Export a backup first if needed.')){state=blank();changed('All local records cleared');}});document.addEventListener('change',e=>{if(e.target.id==='month'&&/^\d{4}-\d\d$/.test(e.target.value)){month=e.target.value;render();}});$('restoreFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>15e6)throw Error('File too large');let incoming=validate(JSON.parse(await file.text()));if(confirm('Replace all current records with this backup?')){state=incoming;changed('Backup restored');}}catch(err){toast('Invalid backup. Existing records were not changed.');}finally{e.target.value='';}};window.addEventListener('focus',()=>{if(!$('modal').open)render();});render();
</script></body></html>
